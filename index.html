<!DOCTYPE html>
<html>
    <head>
        <title>Home Page</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <ul>
            <li><a href="#TributePage">Tribute Page</a></li>
            <li><a href="#SeasonsGallery">Seasons Gallery</a></li>
            <li><a href="#BestCuisines">Best Cuisines</a></li>
            <li><a href="#MarvelCharacters">Marvel Characters</a></li>
        </ul>
        <header>
            <h1>Home Page</h1>
            <h3>Jochem's Creations</h3>
        </header>
        <div class="project" id="TributePage" onclick="ToPage('TributePage')">
            <h2>Project #1: Tribute Page</h2>
            <iframe src="https://jochemjetlearn.github.io/tribute_page/"></iframe>
        </div>
        <div class="project" id="SeasonsGallery" onclick="ToPage('SeasonsGallery')">
            <h2>Project #2: Seasons Gallery</h2>
            <iframe height="600px" src="https://jochemjetlearn.github.io/webdevelopment/seasons%20gallery/"></iframe>
        </div>
        <div class="project" id="BestCuisines" onclick="ToPage('BestCuisines')">
            <h2>Project #3: Best Cuisines</h2>
            <iframe height="600px" src="https://jochemjetlearn.github.io/webdevelopment/best%20cuisines/"></iframe>
        </div>
        <div class="project" id="MarvelCharacters" onclick="ToPage('MarvelCharacters')">
            <h2>Project #4: Marvel Characters</h2>
            <iframe height="600px" src="https://jochemjetlearn.github.io/webdevelopment/marvel/"></iframe>
        </div>
        <script>
            let pages = {
                "TributePage": "https://jochemjetlearn.github.io/tribute_page/",
                "SeasonsGallery": "https://jochemjetlearn.github.io/webdevelopment/seasons%20gallery/",
                "BestCuisines": "https://jochemjetlearn.github.io/webdevelopment/best%20cuisines/",
                "MarvelCharacters": "https://jochemjetlearn.github.io/webdevelopment/marvel/"
            }

            function ToPage(page) {
                window.location.href = pages[page]
            }
        </script>
    </body>
</html>
